# Comprueba Temple en equipos limpios de GitHub cada vez que se sube codigo.
# Si algo se rompe, el commit sale con una cruz roja en GitHub y llega un correo.
#
#   tests        los tests rapidos, instalando con pip (unos 2 minutos), con el informe
#                de cobertura (que parte del codigo prueban) en el resumen de cada run
#   instalacion  lo que haria un usuario nuevo en Ubuntu y en macOS. bash instalar.sh
#                desde cero (instala Miniconda, el entorno y los modelos y pasa
#                todos los tests, tambien el que carga los modelos de verdad),
#                arrancar con jugar.sh y quitarlo todo con desinstalar.sh
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Sin pantalla ni altavoces, Pygame usa unos falsos
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Librerias del sistema que piden OpenCV y MediaPipe
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libgles2

      - name: Instalar las dependencias
        run: pip install -r requirements.txt

      - name: Instalar coverage (solo aqui, para medir que parte del codigo prueban los tests)
        run: pip install coverage==7.6.10

      - name: Pasar los tests midiendo la cobertura
        run: coverage run --source=temple,main -m unittest discover tests -v

      - name: Informe de cobertura en el resumen del run
        if: always()
        run: |
          coverage report -m
          echo "## Cobertura de los tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "La camara y la ventana de verdad (camara.py, vision.py y ventana.py) solo se prueban con la persona delante." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  instalacion:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest es un Mac con chip de Apple
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Librerias del sistema (en un Ubuntu de escritorio ya vienen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libgles2

      - name: Instalar como un usuario nuevo
        run: bash instalar.sh -y

      - name: Que jugar.sh encuentra el entorno y arranca
        run: bash jugar.sh --help

      - name: Desinstalar
        run: bash desinstalar.sh -y
